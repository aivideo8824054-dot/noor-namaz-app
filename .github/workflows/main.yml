name: Build Noor Namaz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Extract project ZIP
        run: |
          unzip -q Noor-Namaz-Updated-Project.zip -d extracted
          ROOT=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          test -f "$ROOT/settings.gradle"
          cp -r "$ROOT/app" ./app
          cp "$ROOT/settings.gradle" ./settings.gradle
          cp "$ROOT/build.gradle" ./build.gradle
          cp "$ROOT/gradle.properties" ./gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Namaz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
